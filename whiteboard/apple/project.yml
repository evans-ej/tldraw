name: Whiteboard
options:
  bundleIdPrefix: com.example.whiteboard
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: '0.0.1'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '5.9'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Whiteboard

targetTemplates:
  App:
    type: application
    sources:
      - path: Sources
      # Built web app (`npm run build:app` in ../web). Copied as a folder so paths stay intact.
      - path: Web
        type: folder
        buildPhase: resources

targets:
  Whiteboard-macOS:
    templates: [App]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.whiteboard.mac
        PRODUCT_NAME: Whiteboard
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity

  Whiteboard-iOS:
    templates: [App]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.whiteboard.ios
        PRODUCT_NAME: Whiteboard
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
